[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "irtriage"
version = "0.1.0"
description = "Triage intron-retention events from long-read RNA-seq BAMs: per-read evidence, repeat context and a real-vs-artifact score"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pysam>=0.21", "pandas>=1.5", "numpy>=1.23", "scikit-learn>=1.2"]

[project.optional-dependencies]
orf = ["orfipy", "biopython"]
test = ["pytest", "orfipy", "biopython"]

[project.scripts]
irtriage = "irtriage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
